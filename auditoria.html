<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría — Carnicería</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  header{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  header .ttl{font-size:var(--fs-xl);font-weight:700;}
  header .sub{font-size:var(--fs-xs);opacity:.9;}
  header nav a{color:#dbe8ff;text-decoration:none;font-size:var(--fs-sm);font-weight:600;margin-right:14px;}
  header nav a.on,header nav a:hover{color:#fff;}
  header .suc select{padding:5px 8px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:var(--fs-sm);}
  header button{background:#fff;color:var(--brand);border:none;padding:7px 13px;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:var(--fs-sm);}
  main{max-width:1150px;}
  .filtros{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
  .filtros .field{display:flex;flex-direction:column;}
  .filtros label{font-size:var(--fs-xs);color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;}
  .filtros input,.filtros select{padding:7px 10px;border:1px solid var(--border-inp);border-radius:var(--radius-sm);font-size:var(--fs-base);font-family:inherit;background:#fff;}
  .ops{display:flex;gap:6px;flex-wrap:wrap;}
  .ops label{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);cursor:pointer;text-transform:none;letter-spacing:0;}
  .ops input{margin:0;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--surface-3);color:var(--ink-soft);}
  .pill.compra{background:#e6f0ff;color:#1b4f8a;} .pill.gasto{background:#fdeede;color:#9a5a12;}
  .pill.remito{background:#e8f6ee;color:#1e7a46;} .pill.stock{background:#eee9fb;color:#5b3fa0;}
  .pill.caja{background:#e9f7f6;color:#0e7c74;} .pill.venta{background:#fdeaef;color:#9e2a4e;}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>🥩 Carnicería</h1><p>Ingresá con tu usuario.</p>
    <form id="login-form">
      <label>Email</label><input type="email" id="li-email" autocomplete="username" required>
      <label>Contraseña</label><input type="password" id="li-pass" autocomplete="current-password" required>
      <button type="submit" id="li-btn">Entrar</button><div class="err" id="li-err"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div><div class="ttl">🔎 Auditoría</div><div class="sub">Quién hizo qué, cuándo y en qué local</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="suc">📍 <select id="selSuc" onchange="cargar()"></select></div>
      <button id="btn-salir">Salir</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="filtros">
        <div class="field"><label>Desde</label><input id="f-desde" type="date" onchange="cargar()"></div>
        <div class="field"><label>Hasta</label><input id="f-hasta" type="date" onchange="cargar()"></div>
        <div class="field"><label>Usuario</label><select id="f-usuario" onchange="cargar()"></select></div>
        <div class="field" style="flex:1;min-width:200px;"><label>Buscar</label><input id="f-q" placeholder="Detalle, comprobante…" oninput="render()"></div>
        <button class="btn-sec" onclick="exportar()">⬇ Excel</button>
      </div>
      <div class="field" style="margin-bottom:4px;"><label>Operaciones</label>
        <div class="ops" id="f-ops">
          <label><input type="checkbox" value="compra" checked onchange="cargar()"> Compras</label>
          <label><input type="checkbox" value="gasto" checked onchange="cargar()"> Gastos</label>
          <label><input type="checkbox" value="stock" checked onchange="cargar()"> Movimientos de stock</label>
          <label><input type="checkbox" value="remito" checked onchange="cargar()"> Remitos</label>
          <label><input type="checkbox" value="caja" checked onchange="cargar()"> Caja</label>
          <label><input type="checkbox" value="venta" onchange="cargar()"> Ventas</label>
        </div>
      </div>
      <div id="resumen" class="muted" style="font-size:var(--fs-sm);margin:10px 0 6px;">—</div>
      <div class="tblwrap"><table class="data compact"><thead><tr>
        <th>Fecha</th><th>Operación</th><th>Acción</th><th>Local</th><th>Usuario</th><th>Detalle</th><th class="num">Monto</th><th class="num">Cantidad</th><th>Ref</th>
      </tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </main>
</div>

<div class="toast-c" id="toast-c"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.APP_BUILD='2026-10-27.2';</script>
<script src="sb-api.js?v=2026-10-27.2"></script>
<script src="auth-guard.js?v=2026-10-27.2"></script>
<script src="nav.js?v=2026-10-27.2"></script>
<script>
var sb=window.sbClient;
var SUCS=[], SUCID={}, EVENTOS=[];
function p2(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function fmt$(n){ return '$'+Math.round(Number(n)||0).toLocaleString('es-AR'); }
function fmtKg(n){ return (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:3}); }
function fechaHora(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d)) return s; return d.toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function toast(m,t){ var c=document.getElementById('toast-c'); var e=document.createElement('div'); e.className='toast'+(t?' '+t:''); e.textContent=m; c.appendChild(e); setTimeout(function(){e.remove();},2600); }

document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault(); var btn=document.getElementById('li-btn'), err=document.getElementById('li-err'); err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  var r=await sb.auth.signInWithPassword({ email:document.getElementById('li-email').value.trim(), password:document.getElementById('li-pass').value });
  btn.disabled=false; btn.textContent='Entrar'; if(r.error){ err.textContent='No se pudo entrar: '+r.error.message; return; } iniciar();
});
document.getElementById('btn-salir').addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });
(async function(){ var s=await sb.auth.getSession(); if(s.data && s.data.session) iniciar(); })();

async function iniciar(){
  document.getElementById('login').hidden=true; document.getElementById('app').hidden=false;
  var rs=await window.sf('getSucursales'); var suc=(rs.ok?(rs.sucursales||[]):[]);
  SUCS=suc; SUCID={}; suc.forEach(function(s){ SUCID[s.id]=s.nombre; });
  document.getElementById('selSuc').innerHTML='<option value="">Todos los locales</option>'+suc.map(function(s){ return '<option value="'+s.nombre+'">'+s.nombre+'</option>'; }).join('');
  // Usuarios para el filtro
  var up=await window.sf('getPerfiles'); var pfs=(up.ok?(up.perfiles||[]):[]).filter(function(p){ return p.usuarioId; });
  document.getElementById('f-usuario').innerHTML='<option value="">Todos los usuarios</option>'+pfs.map(function(p){ return '<option value="'+p.usuarioId+'">'+(p.nombre||p.usuario||p.email)+'</option>'; }).join('');
  // Rango por defecto: mes actual
  var hoy=new Date(); document.getElementById('f-hasta').value=iso(hoy);
  document.getElementById('f-desde').value=iso(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  cargar();
}

function opsSeleccionadas(){ var a=[]; document.querySelectorAll('#f-ops input:checked').forEach(function(c){ a.push(c.value); }); return a; }

async function cargar(){
  var ops=opsSeleccionadas();
  if(!ops.length){ EVENTOS=[]; render(); document.getElementById('resumen').textContent='Elegí al menos una operación.'; return; }
  var qs='getAuditoria&limit=3000'
    +'&desde='+encodeURIComponent(document.getElementById('f-desde').value)
    +'&hasta='+encodeURIComponent(document.getElementById('f-hasta').value)
    +'&operaciones='+encodeURIComponent(ops.join(','));
  var suc=document.getElementById('selSuc').value; if(suc) qs+='&sucursal='+encodeURIComponent(suc);
  var usr=document.getElementById('f-usuario').value; if(usr) qs+='&usuarioId='+encodeURIComponent(usr);
  document.getElementById('resumen').textContent='Cargando…';
  var r=await window.sf(qs);
  if(!r.ok){ toast('Error: '+(r.error||''),'error'); document.getElementById('resumen').textContent='Error al cargar.'; return; }
  EVENTOS=r.eventos||[]; render();
}

function render(){
  var q=(document.getElementById('f-q').value||'').trim().toLowerCase();
  var arr=EVENTOS.filter(function(e){ return !q || ((e.detalle||'')+' '+(e.ref||'')+' '+(e.usuario||'')).toLowerCase().indexOf(q)>=0; });
  document.getElementById('resumen').textContent=arr.length+' evento'+(arr.length!==1?'s':'')+(EVENTOS.length>=3000?' (tope 3000 — acotá el período)':'');
  document.getElementById('tbody').innerHTML=arr.map(function(e){
    return '<tr><td style="white-space:nowrap;">'+fechaHora(e.fecha)+'</td>'+
      '<td><span class="pill '+(e.operacion||'')+'">'+(e.operacion||'')+'</span></td>'+
      '<td>'+(e.accion||'')+'</td>'+
      '<td>'+(e.local||'')+'</td>'+
      '<td>'+(e.usuario||'—')+'</td>'+
      '<td>'+(e.detalle||'')+'</td>'+
      '<td class="num">'+(e.monto!=null?fmt$(e.monto):'')+'</td>'+
      '<td class="num">'+(e.cantidad!=null?fmtKg(e.cantidad):'')+'</td>'+
      '<td>'+(e.ref||'')+'</td></tr>';
  }).join('') || '<tr><td colspan="9" class="muted">Sin eventos para esos filtros.</td></tr>';
}

function exportar(){
  var q=(document.getElementById('f-q').value||'').trim().toLowerCase();
  var arr=EVENTOS.filter(function(e){ return !q || ((e.detalle||'')+' '+(e.ref||'')+' '+(e.usuario||'')).toLowerCase().indexOf(q)>=0; });
  if(!arr.length){ toast('No hay eventos para exportar','error'); return; }
  var aoa=[['Fecha','Operación','Acción','Local','Usuario','Detalle','Monto','Cantidad','Ref']];
  arr.forEach(function(e){ aoa.push([fechaHora(e.fecha), e.operacion, e.accion, e.local, e.usuario, e.detalle, (e.monto!=null?e.monto:''), (e.cantidad!=null?e.cantidad:''), e.ref]); });
  var ws=XLSX.utils.aoa_to_sheet(aoa); var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Auditoria');
  XLSX.writeFile(wb, 'Auditoria_'+document.getElementById('f-desde').value+'_'+document.getElementById('f-hasta').value+'.xlsx');
}
</script>
</body>
</html>
